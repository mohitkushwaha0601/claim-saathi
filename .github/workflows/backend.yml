name: Backend checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend sanity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install uv

      - name: Install backend dependencies
        run: uv sync --frozen

      - name: Run backend tests
        run: uv run pytest -q

      - name: Build backend Docker image
        working-directory: .
        run: docker build -f backend/Dockerfile -t backend-sanity .
